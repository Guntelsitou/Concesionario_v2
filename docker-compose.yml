services:
  backend:
    build: .
    restart: unless-stopped
    env_file:
      - bot/.env
    environment:
      WEB_DIR: /app/web
      DATA_DIR: /data
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - bot-data:/data
      - ./:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bot-data:
